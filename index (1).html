<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nobaarr — Nonton Bareng, Temukan Film Favoritmu</title>
<meta name="description" content="Nobaarr: jelajahi film berdasarkan genre, filter, dan tonton trailernya langsung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
:root{
  --bg:#fbf8f3; --surface:#ffffff; --ink:#1b1a2e; --muted:#6b6880; --line:#ece6dc;
  --accent:#ff5a36; --accent-ink:#fff; --violet:#6c4cf1; --sun:#ffc83d; --mint:#1fb58f;
  --radius:20px; --shadow:0 1px 2px rgba(27,26,46,.05),0 8px 24px rgba(27,26,46,.07);
  --shadow-lg:0 2px 4px rgba(27,26,46,.06),0 20px 50px rgba(27,26,46,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
[x-cloak]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Header */
header.top{position:sticky;top:0;z-index:40;background:rgba(251,248,243,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Bricolage Grotesque';font-weight:800;font-size:1.6rem;letter-spacing:-.04em}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#ff8a4c);display:grid;place-items:center;box-shadow:0 6px 14px rgba(255,90,54,.35);transform:rotate(-6deg)}
.logo-mark svg{width:14px;height:14px;fill:#fff;margin-left:2px}
.logo b{color:var(--accent)}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 44px 0 46px;font:inherit;outline:none;transition:.2s}
.search input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(108,76,241,.12)}
.search svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search .clear{position:absolute;right:10px;top:50%;translate:0 -50%;width:26px;height:26px;border-radius:50%;background:var(--bg);font-size:14px;line-height:26px;color:var(--muted)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.9rem;white-space:nowrap;transition:.2s}
.pill-btn:hover{border-color:var(--ink)}
.pill-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill-btn .count{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px}

/* Hero */
.hero{margin-top:24px;position:relative;border-radius:32px;overflow:hidden;background:#e9e2d6;min-height:460px;box-shadow:var(--shadow-lg);isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 20%;transition:opacity .8s}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(251,248,243,.97) 0%,rgba(251,248,243,.88) 38%,rgba(251,248,243,.15) 78%,rgba(251,248,243,0) 100%)}
.hero-body{padding:56px 52px;max-width:640px;min-height:460px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3;scale:.7}}
.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.02;font-weight:800}
.hero p{color:#3f3c55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:1.02rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-weight:500}
.rate{display:inline-flex;align-items:center;gap:5px;background:var(--sun);color:#3a2b00;font-weight:700;border-radius:999px;padding:3px 10px;font-size:.82rem}
.rate svg{width:12px;height:12px;fill:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 26px;border-radius:999px;font-weight:600;transition:.2s}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px rgba(255,90,54,.35)}
.btn-primary:hover{translate:0 -2px;box-shadow:0 14px 28px rgba(255,90,54,.42)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn svg{width:16px;height:16px;fill:currentColor}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.dots{position:absolute;right:28px;bottom:26px;display:flex;gap:8px}
.dots button{width:10px;height:10px;border-radius:99px;background:rgba(27,26,46,.25);transition:.3s}
.dots button.on{width:30px;background:var(--ink)}
.hero-skel{min-height:460px;background:linear-gradient(100deg,#eee7db 30%,#f6f1e8 50%,#eee7db 70%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Filters */
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:44px 0 16px;flex-wrap:wrap}
.section-head h2{font-size:1.9rem;font-weight:800}
.section-head small{color:var(--muted);font-size:.9rem}
.genres{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.genres::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 18px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:500;font-size:.9rem;transition:.18s}
.chip:hover{border-color:var(--violet);color:var(--violet)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 8px 18px rgba(108,76,241,.3)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);align-items:end}
.field label{display:block;font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.field select{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;outline:none}
.field select:focus{border-color:var(--violet)}
.field input[type=range]{width:100%;accent-color:var(--accent);height:42px}
.toggle{display:flex;align-items:center;gap:10px;height:42px;font-weight:500;font-size:.92rem;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.reset{height:42px;border-radius:12px;background:var(--bg);border:1.5px dashed var(--line);font-weight:600;font-size:.9rem;color:var(--muted)}
.reset:hover{color:var(--accent);border-color:var(--accent)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.card{position:relative;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;transition:.3s;cursor:pointer;animation:rise .5s both}
@keyframes rise{from{opacity:0;translate:0 14px}}
.card:hover{translate:0 -6px;box-shadow:var(--shadow-lg)}
.poster{position:relative;aspect-ratio:2/3;background:#eee7db;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .poster img{scale:1.07}
.poster .rate{position:absolute;left:10px;top:10px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.fav{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:.2s}
.fav:hover{scale:1.12}
.fav svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none}
.fav.on svg{fill:var(--accent);stroke:var(--accent)}
.play-fab{position:absolute;left:50%;bottom:14px;translate:-50% 20px;opacity:0;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:.84rem;box-shadow:0 8px 18px rgba(255,90,54,.4);transition:.3s;white-space:nowrap}
.play-fab svg{width:11px;height:11px;fill:#fff}
.card:hover .play-fab,.card:focus-within .play-fab{translate:-50% 0;opacity:1}
@media (hover:none){.play-fab{translate:-50% 0;opacity:1}}
.info{padding:12px 14px 15px}
.info h3{font-size:1rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.info span{font-size:.82rem;color:var(--muted)}
.skel .poster{animation:sh 1.4s infinite;background:linear-gradient(100deg,#eee7db 30%,#f6f1e8 50%,#eee7db 70%);background-size:200% 100%}
.skel .info{height:70px}
.empty{grid-column:1/-1;text-align:center;padding:64px 20px;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:3rem}
.empty h3{font-size:1.4rem;margin:8px 0 4px}
.empty p{color:var(--muted);margin-bottom:18px}
.more{display:flex;justify-content:center;margin:34px 0 10px}
.err{background:#fff0ed;border:1px solid #ffc9bd;color:#a52a0f;padding:14px 18px;border-radius:14px;margin:16px 0;font-weight:500}

/* Modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(27,26,46,.55);backdrop-filter:blur(8px);display:grid;place-items:start center;overflow-y:auto;padding:4vh 16px}
.modal{width:min(980px,100%);background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative}
.player-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--ink);color:#fff}
.player-bar .logo{font-size:1.15rem;color:#fff}
.player-bar .logo-mark{width:26px;height:26px;border-radius:8px}
.player-bar .logo-mark svg{width:10px;height:10px}
.player-bar .sep{width:1px;height:20px;background:rgba(255,255,255,.25)}
.player-bar .ttl{font-weight:500;font-size:.92rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.player-bar .x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);font-size:18px;transition:.2s}
.player-bar .x:hover{background:var(--accent)}
.screen{position:relative;aspect-ratio:16/9;background:#0e0d1a}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .brand{position:absolute;left:16px;top:14px;z-index:2;pointer-events:none;font-family:'Bricolage Grotesque';font-weight:800;color:#fff;font-size:1.05rem;letter-spacing:-.03em;background:rgba(27,26,46,.55);backdrop-filter:blur(6px);padding:5px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
.screen .brand i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.no-trailer{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;gap:12px;padding:20px;background-size:cover;background-position:center}
.no-trailer::before{content:"";position:absolute;inset:0;background:rgba(14,13,26,.75)}
.no-trailer>*{position:relative}
.vtabs{display:flex;gap:8px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.vtabs .chip{height:34px;font-size:.82rem;padding:0 14px}
.detail{padding:24px 28px 30px;display:grid;grid-template-columns:150px 1fr;gap:26px}
.detail .poster-s{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:2/3;background:#eee7db}
.detail .poster-s img{width:100%;height:100%;object-fit:cover}
.detail h2{font-size:2rem;font-weight:800;line-height:1.1}
.tagline{color:var(--violet);font-style:italic;margin:4px 0 12px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tag{background:rgba(108,76,241,.1);color:var(--violet);padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:600}
.overview{color:#403d57;margin:10px 0 16px}
.cast{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cast span{font-size:.82rem;background:var(--surface);border:1px solid var(--line);padding:5px 12px;border-radius:999px}
.cast em{font-style:normal;color:var(--muted)}
.detail .hero-actions .btn{height:44px;padding:0 20px;font-size:.92rem}

footer{margin-top:70px;padding:34px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:200;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;font-size:.9rem;box-shadow:var(--shadow-lg)}

@media (max-width:760px){
  .top .wrap{gap:10px}
  .logo span.word{font-size:1.35rem}
  .pill-btn.fav-toggle .lbl{display:none}
  .hero-body{padding:34px 24px;min-height:420px}
  .hero::before{background:linear-gradient(180deg,rgba(251,248,243,.35) 0%,rgba(251,248,243,.92) 62%,rgba(251,248,243,.98) 100%)}
  .hero-body{justify-content:flex-end}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .detail{grid-template-columns:1fr;padding:20px}
  .detail .poster-s{display:none}
  .detail h2{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body x-data="nobaarr()" x-init="init()" @keydown.escape.window="closeMovie()">

<!-- HEADER -->
<header class="top">
  <div class="wrap">
    <a href="#" class="logo" aria-label="Nobaarr">
      <span class="logo-mark"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>
      <span class="word">Noba<b>arr</b></span>
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" x-model="query" @input.debounce.500ms="load(true)" placeholder="Cari judul film…" aria-label="Cari film">
      <button class="clear" x-show="query" x-cloak @click="query='';load(true)" aria-label="Hapus pencarian">✕</button>
    </div>
    <button class="pill-btn fav-toggle" :class="{on:onlyFav}" @click="toggleOnlyFav()">
      ♥ <span class="lbl">Daftar Saya</span> <span class="count" x-show="favs.length" x-text="favs.length"></span>
    </button>
  </div>
</header>

<main class="wrap">

  <!-- HERO -->
  <section class="hero" x-show="!onlyFav" aria-label="Film pilihan Nobaarr">
    <template x-if="!heroList.length"><div class="hero-skel"></div></template>
    <template x-for="(h,i) in heroList" :key="h.id">
      <div>
        <div class="hero-bg" :style="`background-image:url(${img(h.backdrop_path,'w1280')});opacity:${i===heroIdx?1:0}`"></div>
        <div class="hero-body" x-show="i===heroIdx" x-transition.opacity.duration.500ms>
          <span class="eyebrow"><i></i> Pilihan Nobaarr minggu ini</span>
          <h1 x-text="h.title"></h1>
          <div class="meta">
            <span class="rate"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.6 1.7 7.3L12 17.8 5.6 21.5l1.7-7.3L2 9.6 9 9z"/></svg><span x-text="h.vote_average.toFixed(1)"></span></span>
            <span x-text="year(h.release_date)"></span>
            <span x-text="genreNames(h.genre_ids).slice(0,3).join(' • ')"></span>
          </div>
          <p x-text="h.overview || 'Sinopsis belum tersedia.'"></p>
          <div class="hero-actions">
            <button class="btn btn-primary" @click="openMovie(h)"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg> Tonton Trailer</button>
            <button class="btn btn-ghost" @click="openMovie(h,false)">Detail Film</button>
          </div>
        </div>
      </div>
    </template>
    <div class="dots" x-show="heroList.length">
      <template x-for="(h,i) in heroList" :key="'d'+h.id">
        <button :class="{on:i===heroIdx}" @click="setHero(i)" :aria-label="'Slide '+(i+1)"></button>
      </template>
    </div>
  </section>

  <!-- GENRE -->
  <div class="section-head">
    <div>
      <h2 x-text="onlyFav ? 'Daftar Saya' : 'Jelajahi Film'"></h2>
      <small x-show="!onlyFav" x-text="summary()"></small>
    </div>
  </div>

  <div class="genres" role="group" aria-label="Genre" x-show="!onlyFav">
    <button class="chip" :class="{on:!selGenres.length}" @click="selGenres=[];load(true)">Semua</button>
    <template x-for="g in genres" :key="g.id">
      <button class="chip" :class="{on:selGenres.includes(g.id)}" @click="toggleGenre(g.id)" x-text="g.name"></button>
    </template>
  </div>

  <!-- FILTER -->
  <div class="filters" x-show="!onlyFav">
    <div class="field">
      <label for="sort">Urutkan</label>
      <select id="sort" x-model="sort" @change="load(true)">
        <option value="popularity.desc">Terpopuler</option>
        <option value="vote_average.desc">Rating tertinggi</option>
        <option value="primary_release_date.desc">Rilis terbaru</option>
        <option value="primary_release_date.asc">Rilis terlama</option>
        <option value="revenue.desc">Pendapatan terbesar</option>
      </select>
    </div>
    <div class="field">
      <label for="year">Tahun rilis</label>
      <select id="year" x-model="yearSel" @change="load(true)">
        <option value="">Semua tahun</option>
        <template x-for="y in years" :key="y"><option :value="y" x-text="y"></option></template>
      </select>
    </div>
    <div class="field">
      <label>Rating minimal: <span x-text="minRating>0 ? minRating+'+' : 'Semua'"></span></label>
      <input type="range" min="0" max="9" step="1" x-model.number="minRating" @change="load(true)" aria-label="Rating minimal">
    </div>
    <div class="field">
      <label>Opsi</label>
      <label class="toggle" style="text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink);margin:0">
        <input type="checkbox" x-model="upcoming" @change="load(true)"> Segera tayang saja
      </label>
    </div>
    <button class="reset" @click="resetFilters()">Reset filter</button>
  </div>

  <!-- GRID -->
  <div class="err" x-show="error" x-text="error" x-cloak></div>

  <div class="grid" style="margin-top:26px">
    <template x-for="(m,i) in visibleMovies" :key="m.id">
      <article class="card" :style="`animation-delay:${(i%20)*35}ms`" @click="openMovie(m,false)" tabindex="0" @keydown.enter="openMovie(m,false)">
        <div class="poster">
          <img :src="img(m.poster_path,'w342')" :alt="'Poster '+m.title" loading="lazy">
          <span class="rate" x-show="m.vote_average"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.6 1.7 7.3L12 17.8 5.6 21.5l1.7-7.3L2 9.6 9 9z"/></svg><span x-text="m.vote_average.toFixed(1)"></span></span>
          <button class="fav" :class="{on:isFav(m.id)}" @click.stop="toggleFav(m)" :aria-label="isFav(m.id)?'Hapus dari Daftar Saya':'Tambah ke Daftar Saya'">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9.2C1.2 8.6 3 5 6.5 5c2 0 3.6 1.2 5.5 3.3C13.9 6.2 15.5 5 17.5 5 21 5 22.8 8.6 21.5 11.8 19.5 16.3 12 21 12 21z"/></svg>
          </button>
          <button class="play-fab" @click.stop="openMovie(m,true)"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg> Trailer</button>
        </div>
        <div class="info">
          <h3 x-text="m.title"></h3>
          <span x-text="year(m.release_date)"></span>
        </div>
      </article>
    </template>

    <template x-if="loading">
      <template x-for="n in 10" :key="'s'+n">
        <div class="card skel"><div class="poster"></div><div class="info"></div></div>
      </template>
    </template>

    <div class="empty" x-show="!loading && !visibleMovies.length && !error" x-cloak>
      <div class="big">🎞️</div>
      <h3 x-text="onlyFav ? 'Daftar Saya masih kosong' : 'Film tidak ditemukan'"></h3>
      <p x-text="onlyFav ? 'Tekan ikon ♥ pada poster untuk menyimpan film favoritmu.' : 'Coba ubah kata kunci, genre, atau longgarkan filternya.'"></p>
      <button class="btn btn-primary" @click="onlyFav ? (onlyFav=false) : resetFilters()" x-text="onlyFav ? 'Jelajahi film' : 'Reset filter'"></button>
    </div>
  </div>

  <div class="more" x-show="!onlyFav && page<totalPages && movies.length" x-cloak>
    <button class="btn btn-ghost" @click="loadMore()" :disabled="loading" x-text="loading?'Memuat…':'Muat lebih banyak'"></button>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="logo" style="font-size:1.2rem">Noba<b>arr</b> <span style="font-family:Inter;font-weight:400;font-size:.85rem;color:var(--muted);letter-spacing:0">— nonton bareng, temukan film favoritmu</span></div>
    <div>Data film &amp; gambar oleh <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. Produk ini memakai API TMDB tetapi tidak didukung atau disertifikasi oleh TMDB.</div>
  </div>
</footer>

<!-- MODAL -->
<div class="overlay" x-show="modal.open" x-cloak x-transition.opacity @click.self="closeMovie()" role="dialog" aria-modal="true" aria-label="Detail film">
  <div class="modal" x-show="modal.open" x-transition>
    <div class="player-bar">
      <span class="logo"><span class="logo-mark"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>Noba<b>arr</b></span>
      <span class="sep"></span>
      <span class="ttl" x-text="(modal.movie?.title||'') + (curVideo ? ' — ' + curVideo.type : '')"></span>
      <button class="x" @click="closeMovie()" aria-label="Tutup">✕</button>
    </div>

    <div class="screen">
      <div class="brand" x-show="curVideo"><i></i> Nobaarr Trailer</div>
      <template x-if="modal.open && curVideo">
        <iframe :src="`https://www.youtube-nocookie.com/embed/${curVideo.key}?autoplay=${modal.autoplay?1:0}&rel=0&modestbranding=1&playsinline=1`"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
                :title="'Trailer '+modal.movie?.title"></iframe>
      </template>
      <div class="no-trailer" x-show="!curVideo" :style="modal.movie?.backdrop_path ? `background-image:url(${img(modal.movie.backdrop_path,'w780')})` : ''">
        <div class="display" style="font-size:1.5rem;font-weight:800" x-text="modal.loading ? 'Memuat trailer…' : 'Trailer belum tersedia'"></div>
        <div x-show="!modal.loading">
          <a class="btn btn-primary" target="_blank" rel="noopener" :href="`https://www.youtube.com/results?search_query=${encodeURIComponent((modal.movie?.title||'')+' trailer')}`">Cari di YouTube</a>
        </div>
      </div>
    </div>

    <div class="vtabs" x-show="modal.videos.length>1">
      <template x-for="(v,i) in modal.videos" :key="v.key">
        <button class="chip" :class="{on:modal.vIdx===i}" @click="modal.vIdx=i;modal.autoplay=true" x-text="v.type + (v.name && v.name.length<28 ? ' · '+v.name : '')"></button>
      </template>
    </div>

    <div class="detail" x-show="modal.movie">
      <div class="poster-s"><img :src="img(modal.movie?.poster_path,'w342')" :alt="'Poster '+modal.movie?.title"></div>
      <div>
        <h2 x-text="modal.movie?.title"></h2>
        <p class="tagline" x-show="modal.detail?.tagline" x-text="modal.detail?.tagline"></p>
        <div class="meta">
          <span class="rate" x-show="modal.movie?.vote_average"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.6 1.7 7.3L12 17.8 5.6 21.5l1.7-7.3L2 9.6 9 9z"/></svg><span x-text="modal.movie?.vote_average?.toFixed(1)"></span></span>
          <span x-text="year(modal.movie?.release_date)"></span>
          <span x-show="modal.detail?.runtime" x-text="runtime(modal.detail?.runtime)"></span>
        </div>
        <div class="tags">
          <template x-for="g in (modal.detail?.genres || [])" :key="g.id"><span class="tag" x-text="g.name"></span></template>
        </div>
        <p class="overview" x-text="modal.overview || 'Sinopsis belum tersedia.'"></p>
        <div class="cast" x-show="modal.cast.length">
          <template x-for="c in modal.cast" :key="c.id"><span><b x-text="c.name"></b> <em x-show="c.character" x-text="'· '+c.character"></em></span></template>
        </div>
        <div class="hero-actions">
          <button class="btn btn-primary" @click="toggleFav(modal.movie)" x-text="isFav(modal.movie?.id) ? '♥ Tersimpan' : '♡ Simpan ke Daftar Saya'"></button>
          <button class="btn btn-ghost" @click="share()">Bagikan</button>
          <a class="btn btn-ghost" target="_blank" rel="noopener" :href="`https://www.themoviedb.org/movie/${modal.movie?.id}`">Lihat di TMDB</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" x-show="toast" x-cloak x-transition x-text="toast"></div>

<script>
function nobaarr(){
  return {
    // ====== KONFIGURASI ======
    apiKey: 'fd564905d90fdcd07b165456c09b8f81',
    base: 'https://api.themoviedb.org/3',
    imgBase: 'https://image.tmdb.org/t/p/',
    lang: 'id-ID',

    // ====== STATE ======
    genres: [], movies: [], page: 1, totalPages: 1, loading: false, error: '',
    selGenres: [], query: '', sort: 'popularity.desc', yearSel: '', minRating: 0, upcoming: false,
    heroList: [], heroIdx: 0, heroTimer: null,
    favs: [], onlyFav: false, toast: '', toastTimer: null, reqId: 0,
    modal: { open:false, movie:null, detail:null, overview:'', cast:[], videos:[], vIdx:0, loading:false, autoplay:true },

    get years(){ const y = new Date().getFullYear()+1, a=[]; for(let i=y;i>=1970;i--) a.push(i); return a; },
    get curVideo(){ return this.modal.videos[this.modal.vIdx] || null; },
    get visibleMovies(){ return this.onlyFav ? this.favs : this.movies; },

    // ====== INIT ======
    async init(){
      try{ this.favs = JSON.parse(localStorage.getItem('nobaarr:favs')||'[]'); }catch(e){ this.favs=[]; }
      this.$watch('modal.open', v => { document.body.style.overflow = v ? 'hidden' : ''; });
      this.$watch('favs', v => { try{ localStorage.setItem('nobaarr:favs', JSON.stringify(v)); }catch(e){} });
      await Promise.all([this.loadGenres(), this.loadHero()]);
      await this.load(true);
      this.heroTimer = setInterval(()=>{ if(!this.modal.open && this.heroList.length) this.heroIdx=(this.heroIdx+1)%this.heroList.length; }, 8000);
    },

    // ====== API ======
    async api(path, params={}){
      const p = new URLSearchParams({ api_key:this.apiKey, language:this.lang, ...params });
      const r = await fetch(`${this.base}${path}?${p}`);
      if(!r.ok) throw new Error(r.status===401 ? 'API key TMDB tidak valid.' : `Gagal memuat data (kode ${r.status}).`);
      return r.json();
    },
    img(path, size='w342'){ return path ? `${this.imgBase}${size}${path}` : 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27342%27 height=%27513%27%3E%3Crect fill=%27%23eee7db%27 width=%27100%25%27 height=%27100%25%27/%3E%3C/svg%3E'; },

    async loadGenres(){
      try{ this.genres = (await this.api('/genre/movie/list')).genres; }catch(e){ this.error = e.message; }
    },
    async loadHero(){
      try{
        const d = await this.api('/trending/movie/week');
        this.heroList = d.results.filter(m=>m.backdrop_path && m.overview !== undefined).slice(0,5);
      }catch(e){ /* hero opsional */ }
    },

    async load(reset=true){
      if(this.onlyFav) return;
      if(reset){ this.page=1; this.movies=[]; }
      this.loading=true; this.error='';
      const id = ++this.reqId;
      try{
        const q = this.query.trim(); let path, params={ page:this.page, include_adult:'false' };
        if(q){
          path='/search/movie'; params.query=q;
          if(this.yearSel) params.year=this.yearSel;
        }else{
          path='/discover/movie'; params.sort_by=this.sort;
          if(this.selGenres.length) params.with_genres=this.selGenres.join(',');
          if(this.yearSel) params.primary_release_year=this.yearSel;
          if(this.minRating>0){ params['vote_average.gte']=this.minRating; }
          if(this.minRating>0 || this.sort.startsWith('vote_average')) params['vote_count.gte']= this.sort.startsWith('vote_average') ? 300 : 50;
          if(this.upcoming) params['primary_release_date.gte']=new Date().toISOString().slice(0,10);
          if(this.sort.startsWith('primary_release_date') && !this.upcoming) params['primary_release_date.lte']=new Date().toISOString().slice(0,10);
        }
        const d = await this.api(path, params);
        if(id!==this.reqId) return;
        let res = d.results.filter(m=>m.poster_path);
        if(q){ // filter sisi klien untuk mode pencarian
          if(this.selGenres.length) res = res.filter(m=>this.selGenres.every(g=>m.genre_ids.includes(g)));
          if(this.minRating>0) res = res.filter(m=>m.vote_average>=this.minRating);
          if(this.upcoming) res = res.filter(m=>m.release_date >= new Date().toISOString().slice(0,10));
        }
        const seen = new Set(this.movies.map(m=>m.id));
        this.movies = this.movies.concat(res.filter(m=>!seen.has(m.id)));
        this.totalPages = Math.min(d.total_pages, 500);
      }catch(e){
        if(id===this.reqId) this.error = e.message || 'Terjadi kesalahan jaringan.';
      }finally{
        if(id===this.reqId) this.loading=false;
      }
    },
    async loadMore(){ this.page++; await this.load(false); },

    // ====== FILTER ======
    toggleGenre(id){
      this.selGenres = this.selGenres.includes(id) ? this.selGenres.filter(g=>g!==id) : [...this.selGenres, id];
      this.load(true);
    },
    resetFilters(){
      this.selGenres=[]; this.query=''; this.sort='popularity.desc'; this.yearSel=''; this.minRating=0; this.upcoming=false;
      this.load(true);
    },
    toggleOnlyFav(){ this.onlyFav = !this.onlyFav; if(!this.onlyFav && !this.movies.length) this.load(true); window.scrollTo({top:0,behavior:'smooth'}); },
    summary(){
      const parts=[];
      if(this.query.trim()) parts.push(`hasil untuk “${this.query.trim()}”`);
      if(this.selGenres.length) parts.push(this.genreNames(this.selGenres).join(' + '));
      if(this.yearSel) parts.push('tahun '+this.yearSel);
      if(this.minRating>0) parts.push('rating '+this.minRating+'+');
      if(this.upcoming) parts.push('segera tayang');
      return parts.length ? parts.join(' · ') : 'Semua film, diurutkan dari yang paling populer';
    },

    // ====== HERO ======
    setHero(i){ this.heroIdx=i; },

    // ====== MODAL & TRAILER ======
    async openMovie(m, autoplay=true){
      this.modal = { open:true, movie:m, detail:null, overview:m.overview||'', cast:[], videos:[], vIdx:0, loading:true, autoplay };
      const myId = m.id;
      try{
        const opts = { append_to_response:'videos,credits', include_video_language:'id,en,null' };
        let d = await this.api(`/movie/${m.id}`, opts);
        if(this.modal.movie?.id!==myId) return;
        this.modal.detail = d;
        this.modal.cast = (d.credits?.cast||[]).slice(0,6);
        let vids = d.videos?.results || [];
        if(!d.overview){
          try{
            const en = await fetch(`${this.base}/movie/${m.id}?${new URLSearchParams({api_key:this.apiKey,language:'en-US',append_to_response:'videos'})}`).then(r=>r.json());
            this.modal.overview = en.overview || '';
            if(!vids.length) vids = en.videos?.results || [];
            if(!d.tagline && en.tagline) this.modal.detail = {...d, tagline:en.tagline};
          }catch(e){}
        }else{
          this.modal.overview = d.overview;
        }
        this.modal.videos = this.rankVideos(vids);
      }catch(e){
        this.showToast(e.message);
      }finally{
        if(this.modal.movie?.id===myId) this.modal.loading=false;
      }
    },
    rankVideos(list){
      const yt = list.filter(v=>v.site==='YouTube');
      const order = { Trailer:0, Teaser:1, Clip:2, Featurette:3, 'Behind the Scenes':4 };
      return yt.filter(v=>v.type in order)
        .sort((a,b)=> (order[a.type]-order[b.type]) || ((b.official?1:0)-(a.official?1:0)) || (new Date(b.published_at)-new Date(a.published_at)))
        .slice(0,5);
    },
    closeMovie(){ if(this.modal.open){ this.modal.open=false; setTimeout(()=>{ this.modal.videos=[]; this.modal.movie=null; },250); } },

    // ====== FAVORIT ======
    isFav(id){ return this.favs.some(f=>f.id===id); },
    toggleFav(m){
      if(!m) return;
      if(this.isFav(m.id)){ this.favs = this.favs.filter(f=>f.id!==m.id); this.showToast('Dihapus dari Daftar Saya'); }
      else{
        const { id,title,poster_path,backdrop_path,vote_average,release_date,overview,genre_ids } = m;
        this.favs = [...this.favs, { id,title,poster_path,backdrop_path,vote_average,release_date,overview,genre_ids }];
        this.showToast('Ditambahkan ke Daftar Saya ♥');
      }
    },

    // ====== UTIL ======
    year(d){ return d ? d.slice(0,4) : '—'; },
    runtime(min){ if(!min) return ''; const h=Math.floor(min/60), m=min%60; return h? `${h}j ${m}m` : `${m}m`; },
    genreNames(ids=[]){ return ids.map(id=>this.genres.find(g=>g.id===id)?.name).filter(Boolean); },
    showToast(t){ this.toast=t; clearTimeout(this.toastTimer); this.toastTimer=setTimeout(()=>this.toast='',2200); },
    async share(){
      const m=this.modal.movie; if(!m) return;
      const data={ title:`${m.title} — Nobaarr`, text:`Nonton trailer ${m.title} di Nobaarr!`, url:`https://www.themoviedb.org/movie/${m.id}` };
      try{
        if(navigator.share) await navigator.share(data);
        else{ await navigator.clipboard.writeText(`${data.text} ${data.url}`); this.showToast('Tautan disalin'); }
      }catch(e){}
    }
  }
}
</script>
</body>
</html>
